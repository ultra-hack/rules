name: Build PDF from Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install UnifyJustTheDocs
        run: julia -e 'using Pkg; Pkg.add("UnifyJustTheDocs")'

      - name: Generate unified markdown
        run: |
          julia -e '
            using UnifyJustTheDocs
            result = composite("."; pandoc_anchors = true)
            open("unified.md", "w") do io
                write(io, result)
            end
          '
- name: Convert to PDF with Pandoc
  uses: docker://pandoc/extra:3.8
  with:
    args: >-
      unified.md
      -o output/documentation.pdf
      --toc
      --toc-depth=3
      --pdf-engine=xelatex
      -V mainfont="DejaVu Sans"
      -V geometry:margin=1in
      --number-sections

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: output/documentation.pdf
          retention-days: 90
