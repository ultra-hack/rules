name: Build Unified Markdown

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install UnifyJustTheDocs
        run: julia -e 'using Pkg; Pkg.add("UnifyJustTheDocs")'

      - name: Diagnose each file
        run: |
          julia -e '
            using YAML
            for (root, dirs, files) in walkdir(".")
                occursin("_site", root) && continue
                occursin(".git", root) && continue
                for f in files
                    endswith(f, ".md") || continue
                    path = joinpath(root, f)
                    content = read(path, String)
                    if startswith(content, "---")
                        parts = split(content, "---"; limit = 3)
                        if length(parts) >= 3
                            try
                                YAML.load(parts[2])
                            catch e
                                println("BROKEN FILE: ", path)
                                println("  Error: ", e)
                                println("  --- FRONT MATTER START ---")
                                println(parts[2])
                                println("  --- FRONT MATTER END ---")
                            end
                        else
                            println("NO CLOSING ---: ", path)
                        end
                    end
                end
            end
          '

      - name: Generate unified markdown
        run: |
          julia -e '
            using UnifyJustTheDocs
            result = composite("."; pandoc_anchors = true)
            open("unified.md", "w") do io
                write(io, result)
            end
          '

      - name: Upload unified markdown
        uses: actions/upload-artifact@v4
        with:
          name: unified-markdown
          path: unified.md
          retention-days: 90
