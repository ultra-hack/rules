name: Build Unified Markdown

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unified.md
        run: |
          : > unified.md

          # Функция: выводит файл без front matter (--- ... ---)
          strip_fm() {
            awk '
              NR==1 && $0=="---" { in_fm=1; next }
              in_fm && $0=="---" { in_fm=0; next }
              !in_fm { print }
            ' "$1"
          }

          # 1) index.md — первым
          if [ -f index.md ]; then
            echo "# ULTRA HACK" >> unified.md
            echo "" >> unified.md
            strip_fm index.md >> unified.md
            echo "" >> unified.md
            echo "---" >> unified.md
          fi

          # 2) README.md — вторым
          if [ -f README.md ]; then
            strip_fm README.md >> unified.md
            echo "" >> unified.md
            echo "---" >> unified.md
          fi

          # 3) Все остальные .md из docs/, отсортированные по имени
          find docs -name '*.md' | sort | while IFS= read -r f; do
            echo "" >> unified.md
            echo "---" >> unified.md
            echo "" >> unified.md
            strip_fm "$f" >> unified.md
          done

          echo "=== Готово. Статистика: ==="
          wc -l unified.md
          echo "=== Первые 30 строк: ==="
          head -30 unified.md

      - name: Upload unified markdown
        uses: actions/upload-artifact@v4
        with:
          name: unified-markdown
          path: unified.md
          retention-days: 90
