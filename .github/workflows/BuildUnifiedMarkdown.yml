name: Build Unified Markdown

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install UnifyJustTheDocs
        run: julia -e 'using Pkg; Pkg.add("UnifyJustTheDocs")'

      - name: Generate unified markdown
        run: |
          julia -e '
            using UnifyJustTheDocs
            docs = composite("docs"; pandoc_anchors = true)
            open("unified.md", "w") do io
                write(io, docs)
            end
          '

      - name: Upload unified markdown
        uses: actions/upload-artifact@v4
        with:
          name: unified-markdown
          path: unified.md
          retention-days: 90
