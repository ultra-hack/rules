{%- if site.search_enabled != false -%}
  <script src="{{ '/assets/js/vendor/lunr.multi.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.stemmer.support.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.ru.min.js' | relative_url }}"></script>
{%- endif -%}

<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'darker') {
        // Находим основной CSS-файл темы и подменяем его на тёмный
        var link = document.querySelector('link[rel="stylesheet"]');
        if (link) {
          // Заменяем just-the-docs-default.css (или ultra.css) на darker.css
          link.setAttribute(
            'href',
            link.getAttribute('href').replace(/-(default|ultra)\.css/, '-darker.css')
          );
        }
        // Помечаем html для возможных CSS-правил
        document.documentElement.setAttribute('data-theme', 'darker');
      }
    } catch (e) { /* молча игнорируем */ }
  })();
</script>
