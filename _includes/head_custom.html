{%- if site.search_enabled != false -%}
  <script src="{{ '/assets/js/vendor/lunr.multi.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.stemmer.support.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.ru.min.js' | relative_url }}"></script>
{%- endif -%}

<script>
  (function () {
    try {
      // Читаем сохранённую тему. Используем ключ 'theme', но дублируем в 'jtd-theme' на всякий случай
      var saved = localStorage.getItem('theme');
      if (saved === 'darker') {
        // Находим основной CSS-файл темы (ultra) и меняем его на darker
        var links = document.querySelectorAll('link[rel="stylesheet"]');
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute('href');
          if (href && href.indexOf('just-the-docs-ultra.css') !== -1) {
            links[i].setAttribute('href', href.replace('just-the-docs-ultra.css', 'just-the-docs-darker.css'));
            break;
          }
        }
        // Помечаем html для возможных CSS-правил
        document.documentElement.setAttribute('data-theme', 'darker');
      }
    } catch (e) {
      // Молча игнорируем, чтобы не ломать страницу
    }
  })();
</script>
