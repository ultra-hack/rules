{%- if site.search_enabled != false -%}
  <script src="{{ '/assets/js/vendor/lunr.multi.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.stemmer.support.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/vendor/lunr.ru.min.js' | relative_url }}"></script>
{%- endif -%}

<script>
(function () {
  var saved;

  try {
    saved = localStorage.getItem('theme');
  } catch (error) {
    return;
  }

  if (saved !== 'ultra' && saved !== 'darker') return;

  var stylesheet = document.querySelector(
    'link[rel="stylesheet"][href*="just-the-docs-default.css"],' +
    'link[rel="stylesheet"][href*="just-the-docs-ultra.css"],' +
    'link[rel="stylesheet"][href*="just-the-docs-darker.css"]'
  );

  if (!stylesheet) {
    console.warn('Не найден основной CSS Just-the-Docs');
    return;
  }

  var themeUrls = {
    ultra: {{ '/assets/css/just-the-docs-ultra.css' | relative_url | jsonify }},
    darker: {{ '/assets/css/just-the-docs-darker.css' | relative_url | jsonify }}
  };

  stylesheet.setAttribute('href', themeUrls[saved]);
})();
</script>
