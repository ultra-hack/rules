</a>

<button id="theme-toggle" class="btn btn-outline" style="margin-left: 1rem;">
  Тёмная тема
</button>

<script>
  window.addEventListener('load', function() {
    var btn = document.getElementById('theme-toggle');

    function updateLabel() {
      btn.textContent = jtd.getTheme() === 'darker' ? 'Светлая тема' : 'Тёмная тема';
    }

    // Применяем сохранённую тему (если отличается от загруженной)
    var saved = localStorage.getItem('theme');
    if (saved && saved !== jtd.getTheme()) {
      jtd.setTheme(saved);
    }
    updateLabel();

    btn.addEventListener('click', function() {
      var newTheme = jtd.getTheme() === 'darker' ? 'ultra' : 'darker';
      jtd.setTheme(newTheme);
      localStorage.setItem('theme', newTheme);
      updateLabel();
    });
  });
</script>
