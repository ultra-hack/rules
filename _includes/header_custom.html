<a href="https://t.me/posos_dev"
   class="btn"
   target="_blank"
   rel="noopener"
   style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1;">
  Telegram-канал
</a>

<button
  id="theme-toggle"
  type="button"
  class="btn"
  style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1; margin-left: 1rem;"
>
  Тёмная тема
</button>

<script>
(function () {
  var btn = document.getElementById('theme-toggle');

  function updateLabel() {
    btn.textContent = jtd.getTheme() === 'darker'
      ? 'Светлая тема'
      : 'Тёмная тема';
  }

  updateLabel();

  btn.addEventListener('click', function () {
    var next = jtd.getTheme() === 'darker' ? 'ultra' : 'darker';

    jtd.setTheme(next);
    updateLabel();

    try {
      localStorage.setItem('theme', next);
    } catch (error) {
      console.warn('Не удалось сохранить выбранную тему', error);
    }
  });
})();
</script>
