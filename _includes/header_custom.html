<a href="https://t.me/posos_dev"
   class="btn"
   target="_blank"
   rel="noopener"
   style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1;">
  Telegram-канал
</a>

<button id="theme-toggle" class="btn btn-outline" style="margin-left: 1rem;">
  Тёмная тема
</button>

<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    var html = document.documentElement;

    function updateBtn() {
      btn.textContent = html.hasAttribute('data-theme') ? 'Тема ultra' : 'Тёмная тема';
    }
    updateBtn();

    btn.addEventListener('click', function() {
      if (html.hasAttribute('data-theme')) {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme', 'ultra');
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'darker');
      }
      updateBtn();
    });
  })();
</script>
