<a href="https://t.me/posos_dev" class="btn" target="_blank" rel="noopener" style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1;">
  Telegram-канал
</a>

<button
  id="theme-toggle"
  class="btn"
  style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1; margin-left: 1rem;"
  onclick="
    if (typeof jtd === 'undefined') return;
    var next = jtd.getTheme() === 'darker' ? 'ultra' : 'darker';
    jtd.setTheme(next);
    localStorage.setItem('theme', next);
    this.textContent = next === 'darker' ? 'Светлая тема' : 'Тёмная тема';
  "
>
  Тёмная тема
</button>

<script>
  // Этот код сработает, когда страница и все скрипты (включая jtd) уже загружены
  window.addEventListener('load', function() {
    var saved = localStorage.getItem('theme');
    if (saved === 'darker' && typeof jtd !== 'undefined') {
      jtd.setTheme('darker');
      var btn = document.getElementById('theme-toggle');
      if (btn) btn.textContent = 'Светлая тема';
    }
  });
</script>
