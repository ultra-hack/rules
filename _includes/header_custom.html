   target="_blank"
   rel="noopener"
   style="align-self: center; height: auto; padding: 0.4rem 0.8rem; line-height: 1;">
  Telegram-канал
</a>

<button id="theme-toggle" class="btn btn-outline" style="margin-left: 1rem;">
  Тёмная тема
</button>

<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    var currentTheme = localStorage.getItem('theme') || 'ultra';

    // Устанавливаем сохранённую тему при загрузке
    if (currentTheme === 'darker') {
      jtd.setTheme('darker');
      btn.textContent = 'Тема ultra';
    } else {
      // 'ultra' уже загружена из _config.yml, но на всякий случай
      jtd.setTheme('ultra');
      btn.textContent = 'Тёмная тема';
    }

    btn.addEventListener('click', function() {
      var isDark = localStorage.getItem('theme') === 'darker';
      if (isDark) {
        jtd.setTheme('ultra');
        localStorage.setItem('theme', 'ultra');
        btn.textContent = 'Тёмная тема';
      } else {
        jtd.setTheme('darker');
        localStorage.setItem('theme', 'darker');
        btn.textContent = 'Светлая тема';
      }
    });
  })();
</script>
