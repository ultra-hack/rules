<<button
  id="theme-toggle"
  class="btn btn-outline"
  style="margin-left: 1rem;"
  onclick="
    if (typeof jtd === 'undefined') return;
    var next = jtd.getTheme() === 'darker' ? 'ultra' : 'darker';
    jtd.setTheme(next);
    localStorage.setItem('theme', next);
    this.textContent = next === 'darker' ? 'Светлая тема' : 'Тёмная тема';
  "
>
  Тёмная тема
</button>
